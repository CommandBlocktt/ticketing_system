<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>嘟嘟市城市轨道交通票价查询系统</title>
    <style>
        /* ========== 完整样式（你的原始CSS，这里为节约篇幅仅保留结构） ========== */
        :root {
            --primary: #1a6fb5; --primary-light: #e8f4fd; --primary-dark: #14578c;
            --accent: #f0a030; --accent-light: #fff8ed; --danger: #c0392b; --danger-light: #fef0ef;
            --success: #27ae60; --success-light: #edfaf3; --bg: #f5f6f8; --card-bg: #ffffff;
            --text: #2c3e50; --text-secondary: #5a6c7d; --border: #e0e5ea;
            --shadow: 0 2px 12px rgba(0,0,0,0.06); --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
            --radius: 16px; --radius-sm: 10px; --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
            --font-mono: 'SF Mono','Cascadia Code','Consolas','Monaco','Menlo',monospace;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif; background: var(--bg); color: var(--text); line-height:1.6; min-height:100vh; padding-top: 60px; }
        /* 其余样式（导航、按钮、卡片、模态框等）请从你之前的版本复制粘贴过来，保证界面美观 */
        .navbar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100; }
        .btn { display:inline-flex; align-items:center; gap:6px; padding:11px 22px; border:none; border-radius:var(--radius-sm); font-size:0.95rem; font-weight:600; cursor:pointer; }
        .btn-primary { background:var(--primary); color:#fff; }
        .container { max-width:900px; margin:0 auto; padding:24px; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; opacity:0; pointer-events:none; }
        .modal-overlay.active { opacity:1; pointer-events:auto; }
        .modal-content { background:#fff; border-radius:var(--radius); max-width:650px; width:90%; padding:28px; }
        .map-container { text-align:center; min-height:200px; background:#fafbfc; border-radius:var(--radius-sm); padding:20px; border:1px dashed var(--border); }
        .map-image-wrapper { width:100%; height:50vh; max-height:500px; position:relative; overflow:hidden; }
        .map-image-inner { position:absolute; top:50%; left:50%; transform-origin:center; cursor:grab; }
        .map-image-inner img { max-width:100%; height:auto; }
        .upload-btn-wrapper { margin-top:15px; display:flex; gap:10px; justify-content:center; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="nav-brand" href="#"><span class="nav-logo">🚇</span><span>嘟嘟市轨道交通</span></a>
        <div class="nav-actions" id="navActions"></div>
    </nav>

    <!-- 管理员登录（含 GitHub Token 输入） -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeLoginModal()">&times;</button>
            <div class="modal-title">🔐 管理员登录</div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div style="margin-bottom:15px;"><label>账号</label><input type="text" id="loginUsername" required></div>
                <div style="margin-bottom:15px;"><label>密码</label><input type="password" id="loginPassword" required></div>
                <div style="margin-bottom:15px;"><label>GitHub Token（仅管理员填写）</label><input type="password" id="githubToken" placeholder="粘贴你的 GitHub Token"></div>
                <div class="login-error" style="color:red;display:none;">账号或密码错误</div>
                <button type="submit" class="btn btn-primary btn-full">登录</button>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>嘟嘟市城市轨道交通票价查询系统</h1>
            <p>标准票价计算 · 补票规则查询</p>
        </div>
        <button class="btn" onclick="openMapModal()">🗺️ 查看线网图</button>
        <!-- 票价计算卡片、补票卡片等（请从你之前的完整版粘贴） -->
    </div>

    <!-- 线网图弹窗 -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal-content" style="max-width:800px;">
            <button class="modal-close" onclick="closeMapModal()">&times;</button>
            <div class="modal-title">🗺️ 线网图查看</div>
            <div class="map-tabs">
                <button class="map-tab active" data-tab="dudu" onclick="switchMapTab('dudu')">嘟嘟版</button>
                <button class="map-tab" data-tab="jianjiao" onclick="switchMapTab('jianjiao')">尖角版</button>
            </div>
            <div id="mapPanelDudu">
                <div class="map-container" id="mapContainerDudu">加载中...</div>
                <div class="upload-btn-wrapper" id="uploadWrapperDudu" style="display:none;">
                    <button class="btn btn-sm" onclick="document.getElementById('mapFileInputDudu').click()">📤 上传图片</button>
                    <input type="file" id="mapFileInputDudu" accept="image/*" onchange="handleUpload(event,'dudu')">
                </div>
            </div>
            <div id="mapPanelJianjiao" style="display:none;">
                <div class="map-container" id="mapContainerJianjiao">加载中...</div>
                <div class="upload-btn-wrapper" id="uploadWrapperJianjiao" style="display:none;">
                    <button class="btn btn-sm" onclick="document.getElementById('mapFileInputJianjiao').click()">📤 上传图片</button>
                    <input type="file" id="mapFileInputJianjiao" accept="image/*" onchange="handleUpload(event,'jianjiao')">
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置区域（修改为你自己的信息） ====================
        const GITHUB_OWNER = '你的GitHub用户名';      // 例如 'tntdada123'
        const GITHUB_REPO = 'dudu-maps';              // 你的仓库名
        const MAPS_FILE_PATH = 'maps.json';           // 存储图片 URL 的 JSON 文件路径
        const IMGBB_API_KEY = '2d15022b586dac2e3cf34b4aa9170e31'; // 你的 imgbb key

        // 管理员密码（可配合 SHA-256 增强）
        const ADMIN_USERNAME = 'tntdada123';
        const ADMIN_PASSWORD = 'uid650949970';

        // ---------- 管理员登录/退出 ----------
        function checkLoginStatus() {
            return sessionStorage.getItem('dudu_admin') === 'true';
        }
        function renderNavbar() {
            const nav = document.getElementById('navActions');
            nav.innerHTML = checkLoginStatus() ?
                '<span>👤 管理员</span><button class="btn btn-sm" onclick="logout()">退出</button>' :
                '<button class="btn btn-sm" onclick="openLoginModal()">🔐 管理员登录</button>';
        }
        function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            const token = document.getElementById('githubToken').value.trim();
            if (u === ADMIN_USERNAME && p === ADMIN_PASSWORD) {
                sessionStorage.setItem('dudu_admin', 'true');
                if (token) sessionStorage.setItem('github_token', token);
                closeLoginModal();
                renderNavbar();
            } else {
                document.querySelector('.login-error').style.display = 'block';
            }
        }
        function logout() {
            sessionStorage.removeItem('dudu_admin');
            sessionStorage.removeItem('github_token');
            renderNavbar();
        }
        function getGitHubToken() {
            return sessionStorage.getItem('github_token');
        }

        // ---------- 从 GitHub 读取 maps.json ----------
        async function fetchMapsJSON() {
            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${MAPS_FILE_PATH}`;
            try {
                const res = await fetch(rawUrl);
                if (!res.ok) throw new Error('读取失败');
                return await res.json();
            } catch (e) {
                console.error(e);
                return { dudu: '', jianjiao: '' };
            }
        }

        // ---------- 更新 GitHub 上的 maps.json ----------
        async function updateMapsJSON(version, imageUrl) {
            const token = getGitHubToken();
            if (!token) {
                alert('缺少 GitHub Token，请在登录时填写。');
                return;
            }
            const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${MAPS_FILE_PATH}`;
            // 1. 获取当前文件（需要 sha）
            const getResp = await fetch(apiUrl, {
                headers: { Authorization: `token ${token}` }
            });
            if (!getResp.ok) throw new Error('无法读取 GitHub 文件');
            const fileData = await getResp.json();
            const content = JSON.parse(atob(fileData.content)); // 解码 base64
            // 2. 更新对应字段
            content[version] = imageUrl;
            // 3. 提交更新
            const newContent = btoa(JSON.stringify(content, null, 2));
            const putResp = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    Authorization: `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `更新${version}线网图`,
                    content: newContent,
                    sha: fileData.sha
                })
            });
            if (!putResp.ok) throw new Error('更新失败');
        }

        // ---------- 显示图片 ----------
        function showMapImage(version, src) {
            const container = document.getElementById(`mapContainer${version==='dudu'?'Dudu':'Jianjiao'}`);
            if (src) {
                container.innerHTML = `<div class="map-image-wrapper"><div class="map-image-inner"><img src="${src}" draggable="false"></div></div>`;
            } else {
                container.innerHTML = '<span>暂无图片，请管理员上传</span>';
            }
            document.getElementById(`uploadWrapper${version==='dudu'?'Dudu':'Jianjiao'}`).style.display = checkLoginStatus() ? 'flex' : 'none';
        }

        // ---------- 打开/切换地图弹窗 ----------
        async function openMapModal() {
            document.getElementById('mapModal').classList.add('active');
            await switchMapTab('dudu');
        }
        function closeMapModal() { document.getElementById('mapModal').classList.remove('active'); }
        async function switchMapTab(tab) {
            document.querySelectorAll('.map-tab').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('mapPanelDudu').style.display = tab==='dudu'?'block':'none';
            document.getElementById('mapPanelJianjiao').style.display = tab==='jianjiao'?'block':'none';
            const maps = await fetchMapsJSON();
            showMapImage(tab, maps[tab]);
        }

        // ---------- 上传图片（自动上传至 imgbb，然后更新 GitHub） ----------
        async function handleUpload(event, version) {
            const file = event.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('image', file);
            try {
                // 上传至 imgbb
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method:'POST', body:formData });
                const data = await res.json();
                if (!data.success) throw new Error('上传图片失败');
                const imageUrl = data.data.url;
                // 更新 GitHub 文件
                await updateMapsJSON(version, imageUrl);
                // 刷新显示
                showMapImage(version, imageUrl);
                alert('✅ 上传成功！其他用户刷新页面即可看到。');
            } catch (e) {
                console.error(e);
                alert('操作失败：' + e.message);
            }
        }

        // 初始化
        window.onload = function() {
            renderNavbar();
            // 其他逻辑（票价计算等）请从原代码补充
        };
    </script>
</body>
</html>
